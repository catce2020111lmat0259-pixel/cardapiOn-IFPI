<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro - CardapiOn.IFPI</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" href="tela_criacaoConta.css" />

    <script src="tela_criacaoConta.js" defer></script>
</head>

<body>
    <div class="login-page">
        <div class="login-box">
            <img src="logo-ifpi-transp.png" alt="Logo IFPI" class="logo" />

            <h1>Cadastro</h1>
            <p>Crie sua conta no <strong>CardapiOn.IFPI</strong>:</p>

            <form id="cadastroForm">
                <label for="nome">Nome de usúario</label>
                <input type="text" id="nome" name="nome" required autocomplete="name" />

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required autocomplete="email" />

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}"
                    placeholder="000.000.000-00 ou 00000000000" autocomplete="off" />

                <label for="senha">Senha</label>
                <div class="senha-container">
                    <input type="password" id="senha" name="senha" required minlength="8" />
                    <span id="toggleSenha" class="material-icons">visibility</span>
                </div>

                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" required minlength="8" />

                <!-- mensagens de erro -->
                <div id="mensagemErro" style="color: red; margin-top: 10px;"></div>

                <button type="submit">Criar conta</button>
                <a href="../../sprint 02/tela_login/tela_login.html">Já tem conta? Faça login</a>
            </form>

        </div>
    </div>
</body>

</html>
